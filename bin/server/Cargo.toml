[package]
name = "octo-server"
default-run = "octo-server"
description = "octo service: composes the REST API and the deposit ingest worker into one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "octo-server"
path = "src/main.rs"

[dependencies]
octo-api.workspace = true
octo-ingest.workspace = true
octo-store.workspace = true
octo-webhooks.workspace = true
octo-email.workspace = true
octo-wallet-core.workspace = true
octo-resilience.workspace = true
octo-metrics.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true
dotenvy = "0.15"
# Only for the `otel` exporter; both are already in the tree via the API crate.
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
# OTLP/HTTP span export (issue #468). Still off at runtime until OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = ["dep:reqwest", "dep:serde_json"]
