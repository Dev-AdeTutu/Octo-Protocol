[package]
name = "octo-seed"
version = "0.1.0"
edition = "2021"
description = "Idempotent seed binary producing demo users, wallets and deposits for local development"
publish = false

[[bin]]
name = "octo-seed"
path = "src/main.rs"

[dependencies]
octo-store = { path = "../../crates/octo-store" }
octo-wallet-core = { path = "../../crates/octo-wallet-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
zeroize = "1"