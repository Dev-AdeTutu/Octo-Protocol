[package]
name = "horizon-mock"
version = "0.1.0"
edition = "2021"
description = "Offline mock Horizon server for local development and tests"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "horizon_mock"
path = "src/lib.rs"

[[bin]]
name = "horizon-mock"
path = "src/main.rs"