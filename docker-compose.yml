services:
  db:
    image: postgres:17-alpine
    container_name: octo-db
    environment:
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: octo
      POSTGRES_DB: octo
    ports:
      # Host 5433 -> container 5432, to avoid colliding with a host Postgres on 5432.
      - "5433:5432"
    volumes:
      - octo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional DB UI — `docker compose up adminer` — http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: octo-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    profiles: ["tools"]

  # Optional seed runner — `docker compose --profile tools run seed`
  # Produces demo users, wallets and deposits against the local testnet config.
  # Refuses to run against mainnet configs (see seed binary).
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octo-seed
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://octo:octo@db:5432/octo
      STELLAR_NETWORK: testnet
      HORIZON_URL: http://horizon-mock:8000
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Optional offline mock Horizon — `docker compose --profile tools up horizon-mock`
  # Serves scripted accounts, payments and submit responses for offline development.
  horizon-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octo-horizon-mock
    command: ["horizon-mock"]
    environment:
      HORIZON_MOCK_ADDR: 0.0.0.0:8000
      HORIZON_MOCK_FIXTURES: /app/fixtures/horizon
    ports:
      - "8000:8000"
    profiles: ["tools"]

volumes:
  octo_pgdata: