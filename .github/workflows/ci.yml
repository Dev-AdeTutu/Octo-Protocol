name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, so the token stays read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # octo-store uses runtime sqlx queries (not the compile-time query! macro), so the build is
      # hermetic; this URL lets the store integration tests run against the Postgres service.
      DATABASE_URL: postgres://octo:octo@localhost:5432/octo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # SHA-pinned (see the `pinned-actions` job) and passed the Rust toolchain version
        # explicitly via `with.toolchain`. Decouples action upgrades from toolchain
        # version pinning. The explicit `toolchain: 1.84.1` input matches the project's
        # already-pinned `rust-toolchain.toml`, so rustup derives the per-host triple
        # correctly and `cargo install` no longer resolves against a stale channel name.
        # See Octo-Protocol-org/Octo-Protocol#33.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.84.1
          components: rustfmt, clippy

      - name: Cache cargo
        # SHA-pin to v2.9.1 (was @v2 — a moving major tag, so the action's behaviour
        # could drift between runs). cache-on-failure: false prevents the cache layer
        # from persisting a poisoned rustup state after a job failure, which was the
        # suspected vector behind PR #35's persistent `target triple in channel name`
        # failures on a clean second run. shared-cache: true lets PR builds reuse the
        # main-branch cache so the warm cache starts from a known-good baseline rather
        # than a per-PR reproduction.
        # Supersedes part of #34 / #35; closes Octo-Protocol-org/Octo-Protocol#33.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-cache: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # --locked makes lockfile drift a hard failure in CI rather than cargo silently
        # regenerating Cargo.lock from manifests, which previously masked publisher-side out-of-sync
        # changes. See Octo-Protocol-org/Octo-Protocol#33 (sibling fix for toolchain-channel pinning).
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # --locked: same rationale as Clippy above — fail loudly on lockfile drift.
        run: cargo test --workspace --locked

  # Supply-chain and secret scanning. These ran until 071e4d5 dropped them; restored here because
  # nothing has been checking dependency advisories on a non-custodial codebase that moves funds.
  # Documented exceptions live in deny.toml, .cargo/audit.toml, and .gitleaksignore.
  audit:
    name: cargo-audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set cache key date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Cache cargo-audit binary and advisory DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-
      # A prebuilt binary, deliberately not rustsec/audit-check: that action shells out to
      # `cargo install cargo-audit`, which picks up the 1.84.1 pin in rust-toolchain.toml and
      # fails, because a current cargo-audit needs rustc 1.88+. Installing a prebuilt binary
      # sidesteps the toolchain entirely — the scan reads Cargo.lock and compiles nothing.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      # Invoked directly rather than as `cargo audit`, so the pinned cargo shim is not involved.
      # Documented exceptions live in .cargo/audit.toml.
      - name: Audit
        run: cargo-audit audit

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set cache key date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Cache cargo-deny advisory DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-dbs
          key: ${{ runner.os }}-cargo-deny-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  secret-scan:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and later deleted is still a leaked secret.
          fetch-depth: 0
      # The binary rather than gitleaks-action, which requires a paid licence key for
      # organization-owned repositories — the likely reason this job was dropped originally.
      - name: Install gitleaks
        # Checksum-verified before extraction so a tampered release asset cannot run in CI.
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: Scan history
        # --redact keeps any match out of the public log output.
        run: gitleaks git --redact --no-banner --verbose

  # Guards against careless migrations that lock a hot table or drop data. Only runs when a PR
  # touches the migrations directory, so unrelated PRs pay nothing. The linter itself lives in
  # scripts/lint-migrations.sh; destructive statements are allowed only with an explicit
  # `-- migration-lint: allow <reason>` annotation in the SQL file.
  migration-lint:
    name: migration lint (destructive / locking statements)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge base to diff against, so fetch enough history for the base branch.
          fetch-depth: 0
      - name: Detect changed migrations
        id: changed
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'crates/store/migrations/**.sql' || true)
          if [ -z "$files" ]; then
            echo "No migration changes; skipping lint."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed migrations:"
            echo "$files"
            echo "any=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Lint migrations
        if: steps.changed.outputs.any == 'true'
        env:
          CHANGED_MIGRATIONS: ${{ steps.changed.outputs.files }}
        run: |
          # Feed the changed files to the linter; it exits non-zero on any unannotated
          # destructive or locking statement.
          printf '%s\n' "$CHANGED_MIGRATIONS" | xargs -r scripts/lint-migrations.sh

  # A moving tag (e.g. @v4) can be repointed by whoever controls the action's repo; a full commit
  # SHA cannot. Dependabot keeps the pins and their version comments current.
  pinned-actions:
    name: GitHub Actions pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject unpinned actions
        run: scripts/check-pinned-actions.sh

  integration-test:
    name: Bruno API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://octo:octo@localhost:5432/octo
      NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      FRIENDBOT_URL: https://friendbot.stellar.org
      PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_test_dummy_key_for_ci
      EMAIL_FROM_ADDRESS: Octo <noreply@octohq.org>
      MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JWT_SECRET: supersecretjwtkeyforminimumnsixteenbytes
      BIND_ADDR: 0.0.0.0:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.84.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-cache: true
      - name: Install scripts dependencies
        run: |
          cd api-tests/scripts && npm ci || npm install
      - name: Run server and Bruno collection
        run: |
          cargo run -p octo-server &
          SERVER_PID=$!
          echo "Waiting for octo-server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "octo-server is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "octo-server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          npx -y @usebruno/cli run api-tests --env Local || true
          kill $SERVER_PID 2>/dev/null || true

  # Tag-triggered release build. Produces verifiable artifacts: a SHA256SUMS file users can
  # check with `sha256sum -c`, plus a SLSA build-provenance attestation. Release notes are
  # extracted from CHANGELOG.md so the published release matches the repo's history.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release and upload assets
      id-token: write       # OIDC token for the SLSA provenance generator
      attestations: write   # write build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.84.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-cache: true
      - name: Build release binaries
        # --locked: fail loudly on lockfile drift rather than silently regenerating it.
        run: |
          cargo build --release --locked \
            -p octo-server \
            -p octo-migrate-keys \
            -p backfill-operation-index
      - name: Stage artifacts and checksums
        run: |
          mkdir -p dist
          for bin in octo-server octo-migrate-keys backfill-operation-index; do
            cp "target/release/${bin}" "dist/${bin}"
          done
          ( cd dist && sha256sum octo-server octo-migrate-keys backfill-operation-index > SHA256SUMS )
          cat dist/SHA256SUMS
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error
      - name: Generate SLSA build provenance
        # Reusable workflow that emits a signed provenance attestation for the artifacts above.
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          base64-subjects: ${{ needs.build.outputs.hashes }}
          upload-assets: false
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Pull the section for this version: from its heading up to the next version heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[?" ver "\\]?" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for ${version}; falling back to tag name." >&2
            echo "Release ${tag}" > release-notes.md
          fi
          {
            echo "body<<EOF"
            cat release-notes.md
            echo ""
            echo "## Verifying artifacts"
            echo ""
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo ""
            echo "Build provenance is attached as a SLSA attestation; verify with"
            echo "\`gh attestation verify <artifact> --repo \${{ github.repository }}\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/octo-server
            dist/octo-migrate-keys
            dist/backfill-operation-index
            dist/SHA256SUMS
          fail_on_unmatched_files: true
